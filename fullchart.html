<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Full View</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #f7f4ef;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      header {
        padding: 0.55rem 1rem;
        background: #1a1a2e;
        color: #f7f4ef;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 0.9rem;
        font-weight: 600;
      }
      .count {
        font-size: 0.72rem;
        opacity: 0.5;
        margin-left: 0.35rem;
      }
      #chart {
        flex: 1;
        overflow: hidden;
        position: relative;
      }
      .axis text {
        font-size: 11px;
        fill: #5a5a7a;
      }
      .axis path,
      .axis line {
        stroke: #ddd;
      }
      .d3-tooltip {
        position: fixed;
        background: rgba(26, 26, 46, 0.95);
        color: #f7f4ef;
        padding: 0.5rem 0.65rem;
        border-radius: 6px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s;
        font-size: 0.72rem;
        line-height: 1.5;
        z-index: 999;
        max-width: 220px;
      }
      .d3-tooltip.show {
        opacity: 1;
      }
      #sidebar {
        position: absolute;
        top: 0;
        left: 0;
        width: 220px;
        height: 100%;
        background: #fff;
        border-right: 1px solid #e5e2dd;
        overflow-y: auto;
        transform: translateX(-220px);
        transition: transform 0.25s;
        z-index: 10;
        display: flex;
        flex-direction: column;
      }
      #sidebar.open {
        transform: translateX(0);
      }
      #chart-area {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        transition: left 0.25s;
      }
      #chart-area.shifted {
        left: 220px;
      }
      .sb-section {
        padding: 0.6rem 0.75rem;
        border-bottom: 1px solid #eee;
      }
      .sb-head {
        font-size: 0.68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #999;
        margin-bottom: 0.4rem;
      }
      .f-select {
        width: 100%;
        font-size: 0.76rem;
        padding: 0.28rem 0.35rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: #fff;
        margin-bottom: 0.35rem;
      }
      .compare-list {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        max-height: 200px;
        overflow-y: auto;
      }
      .compare-item {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.76rem;
        cursor: pointer;
        padding: 0.2rem 0.25rem;
        border-radius: 3px;
      }
      .compare-item:hover {
        background: #f5f5f5;
      }
      .compare-item input {
        margin: 0;
        cursor: pointer;
      }
      .ci-swatch {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        flex-shrink: 0;
      }
      .compare-summary {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        padding: 0.5rem 0.75rem;
        background: #f9f9f9;
        border-bottom: 1px solid #eee;
        font-size: 0.74rem;
      }
      .cs-row {
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        gap: 0.25rem;
        align-items: center;
      }
      .cs-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .cs-mean {
        font-weight: 600;
        color: #1a1a2e;
      }
      .cs-label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .legend {
        display: flex;
        flex-direction: column;
        gap: 0.28rem;
      }
      .leg-item {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.71rem;
        color: #5a5a7a;
      }
      .leg-dot {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        flex-shrink: 0;
      }
      .hdr-btn {
        background: rgba(255, 255, 255, 0.12);
        color: #f7f4ef;
        border: none;
        padding: 0.28rem 0.6rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.76rem;
        white-space: nowrap;
      }
      .hdr-btn:hover {
        background: rgba(255, 255, 255, 0.22);
      }
      .loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(247, 244, 239, 0.85);
        font-size: 0.88rem;
        color: #5a5a7a;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Loading…</h1>
      <span id="subtitle"></span>
      <button class="hdr-btn" id="filter-btn" onclick="toggleSidebar()">
        ⚙ Filters &amp; Compare
      </button>
    </header>
    <div id="chart">
      <div id="sidebar">
        <div class="sb-section">
          <div class="sb-head">Filter / Compare</div>
          <select class="f-select" id="f-field" onchange="onFieldChange()">
            <option value="">— field —</option>
            <option value="neighborhood">Neighborhood</option>
            <option value="style">Style</option>
            <option value="zone">Zone</option>
            <option value="stateUse">State Use</option>
            <option value="bedrooms">Bedrooms</option>
          </select>
          <div class="compare-list" id="compare-list">
            <span style="color: #bbb; font-size: 0.74rem"
              >Select a field above</span
            >
          </div>
        </div>
        <div
          class="compare-summary"
          id="compare-summary"
          style="display: none"
        ></div>
        <div class="sb-section" id="legend-section">
          <div class="sb-head">Legend</div>
          <div class="legend" id="legend"></div>
        </div>
      </div>
      <div id="chart-area">
        <div class="loading" id="loading">Rendering…</div>
      </div>
    </div>
    <div class="d3-tooltip" id="tt"></div>
    <script>
      var tt = d3.select("#tt");
      var raw = null;
      var activeFilter = null;
      var compareColors = {};
      var allFieldValues = {};
      var COMPARE_PALETTE = [
        "#EE7733",
        "#0077BB",
        "#CC3311",
        "#009988",
        "#EE3377",
        "#AA3377",
        "#228833",
        "#CCBB44",
      ];

      function init() {
        try {
          raw = JSON.parse(sessionStorage.getItem("fullChartData"));
        } catch (e) {}
        if (!raw) {
          document.getElementById("title").textContent =
            "No data — open from the main app.";
          document.getElementById("loading").style.display = "none";
          return;
        }
        ["neighborhood", "style", "zone", "stateUse", "bedrooms"].forEach(
          function (f) {
            allFieldValues[f] = Array.from(
              new Set(
                raw.parcels
                  .map(function (p) {
                    return p[f];
                  })
                  .filter(function (v) {
                    return v && v !== "Unknown";
                  }),
              ),
            ).sort(function (a, b) {
              return typeof a === "number"
                ? a - b
                : String(a).localeCompare(String(b));
            });
          },
        );
        buildLegend();
        setTimeout(function () {
          render(getFiltered());
        }, 50);
      }

      function toggleSidebar() {
        var sb = document.getElementById("sidebar");
        var ca = document.getElementById("chart-area");
        var open = sb.classList.toggle("open");
        ca.classList.toggle("shifted", open);
        document.getElementById("filter-btn").textContent = open
          ? "✕ Close"
          : "⚙ Filters & Compare";
        setTimeout(rerender, 260);
      }

      function fmt(v) {
        return v >= 1e6
          ? "$" + (v / 1e6).toFixed(1) + "M"
          : v >= 1e3
            ? "$" + Math.round(v / 1e3) + "K"
            : "$" + Math.round(v);
      }

      function getFiltered() {
        if (
          !activeFilter ||
          !activeFilter.field ||
          activeFilter.values.size === 0
        )
          return raw.parcels;
        return raw.parcels.filter(function (p) {
          return activeFilter.values.has(String(p[activeFilter.field]));
        });
      }

      function onFieldChange() {
        var field = document.getElementById("f-field").value;
        activeFilter = field ? { field: field, values: new Set() } : null;
        compareColors = {};
        buildCompareList(field);
        updateSummary();
        rerender();
      }

      function buildCompareList(field) {
        var el = document.getElementById("compare-list");
        if (!field) {
          el.innerHTML =
            '<span style="color:#bbb;font-size:.74rem">Select a field above</span>';
          return;
        }
        var vals = allFieldValues[field] || [];
        vals.forEach(function (v, i) {
          compareColors[String(v)] =
            COMPARE_PALETTE[i % COMPARE_PALETTE.length];
        });
        el.innerHTML = vals
          .map(function (v) {
            var col = compareColors[String(v)];
            return (
              '<label class="compare-item"><input type="checkbox" value="' +
              v +
              '" onchange="onCheckChange(this)"><div class="ci-swatch" style="background:' +
              col +
              '"></div>' +
              v +
              "</label>"
            );
          })
          .join("");
      }

      function onCheckChange(cb) {
        if (cb.checked) activeFilter.values.add(String(cb.value));
        else activeFilter.values.delete(String(cb.value));
        updateSummary();
        rerender();
      }

      function updateSummary() {
        var el = document.getElementById("compare-summary");
        if (!activeFilter || activeFilter.values.size < 2) {
          el.style.display = "none";
          return;
        }
        var field = activeFilter.field;
        var vals = Array.from(activeFilter.values);
        var stats = vals
          .map(function (v) {
            var pts = raw.parcels.filter(function (p) {
              return String(p[field]) === v && p.assessed2022 > 0;
            });
            var mean22 = pts.length
              ? pts.reduce(function (s, p) {
                  return s + p.assessed2022;
                }, 0) / pts.length
              : 0;
            var pctPts = pts.filter(function (p) {
              return p.assessed2020 > 0;
            });
            var meanPct = pctPts.length
              ? pctPts.reduce(function (s, p) {
                  return (
                    s +
                    ((p.assessed2022 - p.assessed2020) / p.assessed2020) * 100
                  );
                }, 0) / pctPts.length
              : null;
            return { v: v, mean22: mean22, meanPct: meanPct };
          })
          .sort(function (a, b) {
            return b.mean22 - a.mean22;
          });
        var topMean = stats[0].mean22;
        el.style.display = "flex";
        el.innerHTML =
          '<div style="display:grid;grid-template-columns:auto 1fr auto auto;gap:.2rem;font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#999;margin-bottom:.3rem;padding:0 .1rem"><span></span><span></span><span>Mean \'22</span><span>&#916;%</span></div>' +
          stats
            .map(function (m, i) {
              var vsTop =
                i > 0
                  ? (((m.mean22 - topMean) / topMean) * 100).toFixed(1)
                  : null;
              var meanStr = vsTop
                ? '<span style="color:#c84b31">' + vsTop + "%</span>"
                : '<span style="color:#228833">top</span>';
              var pctStr =
                m.meanPct !== null
                  ? '<span style="color:' +
                    (m.meanPct >= 0 ? "#228833" : "#c84b31") +
                    '">' +
                    (m.meanPct >= 0 ? "+" : "") +
                    m.meanPct.toFixed(1) +
                    "%</span>"
                  : '<span style="color:#bbb">—</span>';
              return (
                '<div class="cs-row"><div class="cs-dot" style="background:' +
                compareColors[m.v] +
                '"></div><span class="cs-label">' +
                m.v +
                '</span><span class="cs-mean">' +
                fmt(m.mean22) +
                "</span>" +
                pctStr +
                "</div>"
              );
            })
            .join("");
      }

      function getCompareColor(p) {
        if (
          !activeFilter ||
          !activeFilter.field ||
          activeFilter.values.size < 2
        )
          return null;
        var v = String(p[activeFilter.field]);
        return activeFilter.values.has(v) ? compareColors[v] : null;
      }

      function dotOpacity(p) {
        if (
          !activeFilter ||
          !activeFilter.field ||
          activeFilter.values.size < 2
        )
          return 0.5;
        return activeFilter.values.has(String(p[activeFilter.field]))
          ? 0.75
          : 0.1;
      }

      function dotColor(p) {
        var cc = getCompareColor(p);
        if (cc) return cc;
        var s = raw.symOpt;
        if (!s) return raw.color;
        if (s.type === "categorical" && s.colors) {
          var fm = {
            Zone: "zone",
            "Property Type": "type",
            Neighborhood: "neighborhood",
            "Style Description": "style",
            "State Use Description": "stateUse",
          };
          var v = p[fm[s.value]];
          return v && s.colors[v] ? s.colors[v] : s.colors.default || raw.color;
        }
        if (s.type === "continuous" && s.colorRamp && s._thresholds) {
          var fm2 = {
            "Assessed Total": "assessed2022",
            "Pre Year Assessed Total": "assessed2020",
            "Effective Year Built": "yearBuilt",
            "Land Acres": "acreage",
          };
          var v2 = p[fm2[s.value]];
          if (v2 > 0)
            return d3.scaleThreshold().domain(s._thresholds).range(s.colorRamp)(
              v2,
            );
        }
        if (s.type === "pct_change" && s.colorRamp && s._thresholds) {
          if (p.assessed2020 > 0)
            return d3.scaleThreshold().domain(s._thresholds).range(s.colorRamp)(
              ((p.assessed2022 - p.assessed2020) / p.assessed2020) * 100,
            );
        }
        return raw.color;
      }

      function buildLegend() {
        var el = document.getElementById("legend");
        var s = raw && raw.symOpt;
        if (!s) {
          document.getElementById("legend-section").style.display = "none";
          return;
        }
        if (s.type === "categorical" && s.colors) {
          var counts = {};
          var fm = {
            Zone: "zone",
            Neighborhood: "neighborhood",
            "Style Description": "style",
            "State Use Description": "stateUse",
          };
          raw.parcels.forEach(function (p) {
            var v = p[fm[s.value]];
            if (v) counts[v] = (counts[v] || 0) + 1;
          });
          Object.entries(s.colors)
            .filter(function (e) {
              return e[0] !== "default";
            })
            .sort(function (a, b) {
              return (counts[b[0]] || 0) - (counts[a[0]] || 0);
            })
            .slice(0, 14)
            .forEach(function (e) {
              el.innerHTML +=
                '<div class="leg-item"><div class="leg-dot" style="background:' +
                e[1] +
                '"></div><span>' +
                e[0] +
                "</span></div>";
            });
        } else if (
          (s.type === "continuous" || s.type === "pct_change") &&
          s.colorRamp &&
          s._thresholds
        ) {
          var fmtT = function (v) {
            return s.type === "pct_change"
              ? v >= 0
                ? "+" + v + "%"
                : v + "%"
              : fmt(v);
          };
          s.colorRamp.forEach(function (color, i) {
            var lo = i === 0 ? null : s._thresholds[i - 1],
              hi = s._thresholds[i];
            var label =
              lo === null
                ? "< " + fmtT(hi)
                : hi === undefined
                  ? "> " + fmtT(lo)
                  : fmtT(lo) + " – " + fmtT(hi);
            el.innerHTML +=
              '<div class="leg-item"><div class="leg-dot" style="background:' +
              color +
              '"></div><span>' +
              label +
              "</span></div>";
          });
        } else {
          document.getElementById("legend-section").style.display = "none";
        }
      }

      function rerender() {
        d3.select("#chart-area").selectAll("svg").remove();
        document.getElementById("loading").style.display = "flex";
        setTimeout(function () {
          render(getFiltered());
        }, 30);
      }

      function render(parcels) {
        if (raw.chartType === "scatter") renderScatter(parcels);
        else renderBeeswarm(parcels);
      }

      function renderScatter(pts) {
        pts = pts.filter(function (p) {
          return p[raw.ax.x] > 0 && p[raw.ax.y] > 0;
        });
        var ax = raw.ax,
          isYearX = ax.x === "yearBuilt";
        document.getElementById("title").textContent =
          (raw.axLabels[ax.y] || ax.y) + " vs. " + (raw.axLabels[ax.x] || ax.x);
        document.getElementById("subtitle").innerHTML =
          raw.type.charAt(0).toUpperCase() +
          raw.type.slice(1) +
          '<span class="count">' +
          pts.length.toLocaleString() +
          " parcels</span>";
        var container = document.getElementById("chart-area");
        var W = container.clientWidth,
          H = container.clientHeight;
        var margin = { top: 16, right: 16, bottom: 52, left: 72 };
        var iW = W - margin.left - margin.right,
          iH = H - margin.top - margin.bottom;
        function pct(arr, p) {
          var s = arr.slice().sort(function (a, b) {
            return a - b;
          });
          return s[Math.floor((p / 100) * (s.length - 1))];
        }
        var xVals = pts.map(function (p) {
            return p[ax.x];
          }),
          yVals = pts.map(function (p) {
            return p[ax.y];
          });
        var xMax = isYearX ? d3.max(xVals) * 1.001 : pct(xVals, 97) * 1.05,
          yMax = pct(yVals, 97) * 1.05;
        var xMin = isYearX ? d3.min(xVals) - 2 : 0;
        var xSc = d3.scaleLinear().domain([xMin, xMax]).range([0, iW]);
        var ySc = d3.scaleLinear().domain([0, yMax]).range([iH, 0]);
        var fmtX = function (v) {
          return isYearX
            ? Math.round(v)
            : ax.x.includes("assessed")
              ? fmt(v)
              : v >= 1e3
                ? Math.round(v / 1e3) + "K"
                : Math.round(v);
        };
        var fmtY = function (v) {
          return ax.y.includes("assessed")
            ? fmt(v)
            : v >= 1e3
              ? Math.round(v / 1e3) + "K"
              : Math.round(v);
        };
        var svg = d3
          .select(container)
          .append("svg")
          .attr("width", W)
          .attr("height", H);
        var g = svg
          .append("g")
          .attr(
            "transform",
            "translate(" + margin.left + "," + margin.top + ")",
          );
        var xAxisG = g
          .append("g")
          .attr("class", "axis")
          .attr("transform", "translate(0," + iH + ")")
          .call(d3.axisBottom(xSc).ticks(8).tickFormat(fmtX));
        var yAxisG = g
          .append("g")
          .attr("class", "axis")
          .call(d3.axisLeft(ySc).ticks(8).tickFormat(fmtY));
        svg
          .append("text")
          .attr("text-anchor", "middle")
          .attr("x", margin.left + iW / 2)
          .attr("y", H - 8)
          .style("font-size", "11px")
          .style("fill", "#5a5a7a")
          .style("font-weight", "600")
          .text(raw.axLabels[ax.x] || ax.x);
        svg
          .append("text")
          .attr("text-anchor", "middle")
          .attr("transform", "rotate(-90)")
          .attr("x", -(margin.top + iH / 2))
          .attr("y", 16)
          .style("font-size", "11px")
          .style("fill", "#5a5a7a")
          .style("font-weight", "600")
          .text(raw.axLabels[ax.y] || ax.y);
        var clipped = pts.map(function (p) {
          return Object.assign({}, p, {
            _cx: Math.min(p[ax.x], xMax),
            _cy: Math.min(p[ax.y], yMax),
            _out: p[ax.x] > xMax || p[ax.y] > yMax,
          });
        });
        var r = Math.max(2, Math.min(4, W / 120));
        svg
          .append("defs")
          .append("clipPath")
          .attr("id", "c1")
          .append("rect")
          .attr("x", -r)
          .attr("y", -r)
          .attr("width", iW + r * 2)
          .attr("height", iH + r * 2);
        var dotsG = g.append("g").attr("clip-path", "url(#c1)");
        var bg = clipped.filter(function (p) {
            return !getCompareColor(p);
          }),
          fg = clipped.filter(function (p) {
            return !!getCompareColor(p);
          });
        [bg, fg].forEach(function (group) {
          dotsG
            .selectAll(null)
            .data(group)
            .enter()
            .append("circle")
            .attr("cx", function (p) {
              return xSc(p._cx);
            })
            .attr("cy", function (p) {
              return ySc(p._cy);
            })
            .attr("r", function (p) {
              return p._out ? r * 0.7 : r;
            })
            .attr("fill", function (p) {
              return dotColor(p);
            })
            .attr("fill-opacity", function (p) {
              return dotOpacity(p);
            })
            .attr("stroke", function (p) {
              return dotColor(p);
            })
            .attr("stroke-width", 0.8)
            .on("mouseover", function (ev, p) {
              d3.select(this)
                .attr("fill-opacity", 0.9)
                .attr("r", r + 2);
              tt.classed("show", true)
                .style("left", ev.clientX + 12 + "px")
                .style("top", ev.clientY - 10 + "px")
                .html(
                  "<strong>" +
                    p.address +
                    "</strong><br>" +
                    (raw.axLabels[ax.x] || ax.x) +
                    ": " +
                    (isYearX ? p[ax.x] : fmtX(p[ax.x])) +
                    "<br>" +
                    (raw.axLabels[ax.y] || ax.y) +
                    ": " +
                    fmtY(p[ax.y]),
                );
            })
            .on("mouseout", function (ev, p) {
              d3.select(this)
                .attr("fill-opacity", dotOpacity(p))
                .attr("r", p._out ? r * 0.7 : r);
              tt.classed("show", false);
            });
        });
        var zoom = d3
          .zoom()
          .scaleExtent([0.5, 20])
          .on("zoom", function (ev) {
            var nx = ev.transform.rescaleX(xSc),
              ny = ev.transform.rescaleY(ySc);
            xAxisG.call(d3.axisBottom(nx).ticks(8).tickFormat(fmtX));
            yAxisG.call(d3.axisLeft(ny).ticks(8).tickFormat(fmtY));
            dotsG
              .selectAll("circle")
              .attr("cx", function (p) {
                return nx(
                  Math.min(Math.max(p[ax.x], nx.domain()[0]), nx.domain()[1]),
                );
              })
              .attr("cy", function (p) {
                return ny(
                  Math.min(Math.max(p[ax.y], ny.domain()[0]), ny.domain()[1]),
                );
              });
          });
        svg.call(zoom);
        svg.on("dblclick.zoom", function () {
          svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
        });
        document.getElementById("loading").style.display = "none";
      }

      function renderBeeswarm(allPts) {
        var mode = raw.activeBeeswarmMode || "style",
          groupKey = mode === "bedrooms" ? "bedrooms" : "style";
        var pts = allPts.filter(function (p) {
          return p.assessed2022 > 0 && p[groupKey];
        });
        var counts = {};
        pts.forEach(function (p) {
          var v = p[groupKey];
          if (v) counts[v] = (counts[v] || 0) + 1;
        });
        var categories = Object.entries(counts)
          .sort(function (a, b) {
            return b[1] - a[1];
          })
          .slice(0, 12)
          .map(function (e) {
            return groupKey === "bedrooms" ? +e[0] : e[0];
          });
        var filtered = pts.filter(function (p) {
          return categories.includes(
            groupKey === "bedrooms" ? +p[groupKey] : p[groupKey],
          );
        });
        document.getElementById("title").textContent =
          "Assessment Distribution by " +
          (mode === "bedrooms" ? "Bedrooms" : "Style");
        document.getElementById("subtitle").innerHTML =
          raw.type.charAt(0).toUpperCase() +
          raw.type.slice(1) +
          '<span class="count">' +
          filtered.length.toLocaleString() +
          " parcels</span>";
        var container = document.getElementById("chart-area");
        var W = container.clientWidth,
          H = container.clientHeight;
        var labelW = Math.min(W * 0.28, 140),
          margin = { top: 10, right: 16, bottom: 48, left: labelW };
        var iW = W - margin.left - margin.right,
          iH = H - margin.top - margin.bottom;
        function pct(arr, p) {
          var s = arr.slice().sort(function (a, b) {
            return a - b;
          });
          return s[Math.floor((p / 100) * (s.length - 1))];
        }
        var xMax =
          pct(
            filtered.map(function (p) {
              return p.assessed2022;
            }),
            97,
          ) * 1.05;
        var xSc = d3.scaleLinear().domain([0, xMax]).range([0, iW]);
        var ySc = d3.scaleBand().domain(categories).range([0, iH]).padding(0.3);
        var bw = ySc.bandwidth(),
          r = Math.max(2, Math.min(3.5, bw / 7)),
          halfBand = bw / 2 - r - 1;
        var nodes = filtered.map(function (p) {
          return Object.assign({}, p, {
            _x: Math.min(p.assessed2022, xMax),
            _ty:
              ySc(groupKey === "bedrooms" ? +p[groupKey] : p[groupKey]) +
              bw / 2,
          });
        });
        var svg = d3
          .select(container)
          .append("svg")
          .attr("width", W)
          .attr("height", H);
        var g = svg
          .append("g")
          .attr(
            "transform",
            "translate(" + margin.left + "," + margin.top + ")",
          );
        g.append("g")
          .attr("class", "axis")
          .attr("transform", "translate(0," + iH + ")")
          .call(d3.axisBottom(xSc).ticks(6).tickFormat(fmt));
        categories.forEach(function (cat) {
          var y = ySc(cat) + bw / 2,
            lbl = String(cat);
          g.append("text")
            .attr("x", -6)
            .attr("y", y)
            .attr("dy", ".35em")
            .attr("text-anchor", "end")
            .style("font-size", "11px")
            .style("fill", "#5a5a7a")
            .text(lbl.length > 16 ? lbl.slice(0, 15) + "\u2026" : lbl);
          var cv = filtered
            .filter(function (p) {
              return (
                (groupKey === "bedrooms" ? +p[groupKey] : p[groupKey]) === cat
              );
            })
            .map(function (p) {
              return p.assessed2022;
            });
          if (cv.length) {
            var mn =
              cv.reduce(function (a, b) {
                return a + b;
              }, 0) / cv.length;
            var mx = xSc(Math.min(mn, xMax));
            g.append("line")
              .attr("x1", mx)
              .attr("x2", mx)
              .attr("y1", ySc(cat) + 2)
              .attr("y2", ySc(cat) + bw - 2)
              .attr("stroke", "#1a1a2e")
              .attr("stroke-width", 1.5)
              .attr("stroke-opacity", 0.5)
              .attr("stroke-dasharray", "3,2");
          }
        });
        svg
          .append("text")
          .attr("text-anchor", "middle")
          .attr("x", margin.left + iW / 2)
          .attr("y", H - 6)
          .style("font-size", "11px")
          .style("fill", "#5a5a7a")
          .style("font-weight", "600")
          .text("2022 Assessment Value");
        var circles = g
          .selectAll("circle")
          .data(nodes)
          .enter()
          .append("circle")
          .attr("cx", function (n) {
            return xSc(n._x);
          })
          .attr("cy", function (n) {
            return n._ty;
          })
          .attr("r", r)
          .attr("fill", function (n) {
            return dotColor(n);
          })
          .attr("fill-opacity", function (n) {
            return dotOpacity(n);
          })
          .attr("stroke", function (n) {
            return dotColor(n);
          })
          .attr("stroke-width", 0.5)
          .on("mouseover", function (ev, n) {
            d3.select(this)
              .attr("fill-opacity", 0.9)
              .attr("r", r + 2);
            tt.classed("show", true)
              .style("left", ev.clientX + 12 + "px")
              .style("top", ev.clientY - 10 + "px")
              .html(
                "<strong>" +
                  n.address +
                  "</strong><br>" +
                  (groupKey === "bedrooms" ? "Bedrooms" : "Style") +
                  ": " +
                  n[groupKey] +
                  "<br>2022: " +
                  fmt(n.assessed2022),
              );
          })
          .on("mouseout", function (ev, n) {
            d3.select(this).attr("fill-opacity", dotOpacity(n)).attr("r", r);
            tt.classed("show", false);
          });
        d3.forceSimulation(nodes)
          .force(
            "x",
            d3
              .forceX(function (n) {
                return xSc(n._x);
              })
              .strength(1),
          )
          .force(
            "y",
            d3
              .forceY(function (n) {
                return n._ty;
              })
              .strength(0.8),
          )
          .force("collide", d3.forceCollide(r + 0.5))
          .alphaDecay(0.03)
          .on("tick", function () {
            nodes.forEach(function (n) {
              n.y = Math.max(n._ty - halfBand, Math.min(n._ty + halfBand, n.y));
            });
            circles
              .attr("cx", function (n) {
                return n.x;
              })
              .attr("cy", function (n) {
                return n.y;
              });
          })
          .on("end", function () {
            document.getElementById("loading").style.display = "none";
          });
      }

      window.addEventListener("load", init);
    </script>
  </body>
</html>
